name: CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
      - run: yarn turbo run lint --affected

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
      - run: yarn format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
      - run: yarn turbo run typecheck --affected

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: welcomer
          POSTGRES_PASSWORD: welcomer
          POSTGRES_DB: welcomer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U welcomer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
      - run: cp packages/database/.env.example packages/database/.env
      - run: yarn turbo run db:deploy
      - run: yarn turbo run test --affected

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
      - run: cp apps/dashboard/.env.example apps/dashboard/.env
      - run: yarn workspace dashboard playwright install --with-deps
      - run: yarn turbo run e2e --affected

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
      - run: yarn turbo run build --affected
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: false
          cache-from: type=gha,scope=dashboard
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/bot/Dockerfile
          push: false
          cache-from: type=gha,scope=bot
